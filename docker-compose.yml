services:
  job_server:
    build: .
    image: gr00t-job-server:latest
    runtime: nvidia
    env_file: .env
    ports:
      - "8765:8765"
      - "5555:5555"
    environment:
      - HF_HOME=/workspace/cache/huggingface
    volumes:
      - /home/innovation-hacking/heizmany/models:/workspace/models
      - /home/innovation-hacking/heizmany/datasets:/workspace/datasets
      - ./logs:/workspace/logs
      - ./cache:/workspace/cache
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: "16gb"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
